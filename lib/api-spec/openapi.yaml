openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Store catalog operations
  - name: admin
    description: Admin catalog operations
  - name: orders
    description: Order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List store products
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
    get:
      operationId: listOrders
      tags: [admin]
      summary: List all orders (admin)
      responses:
        "200":
          description: List of orders with items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderWithItems"
        "401":
          description: Unauthorized
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
        "404":
          description: Order not found
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted product
        "401":
          description: Unauthorized
        "404":
          description: Product not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, price, imageUrl, description, featured]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
          minimum: 0
          nullable: true
        imageUrl:
          type: string
        description:
          type: string
        featured:
          type: boolean
    ProductInput:
      type: object
      required: [name, category, price, imageUrl, description]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
          nullable: true
        imageUrl:
          type: string
          minLength: 1
        description:
          type: string
        featured:
          type: boolean
    OrderItem:
      type: object
      required: [id, orderId, productName, imageUrl, price, quantity]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        productName:
          type: string
        imageUrl:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
          nullable: true
        quantity:
          type: integer
    Order:
      type: object
      required: [id, orderNumber, customerName, email, phone, cep, city, address, state, total, status, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        cep:
          type: string
        city:
          type: string
        address:
          type: string
        state:
          type: string
        note:
          type: string
          nullable: true
        total:
          type: number
        status:
          type: string
        createdAt:
          type: string
    OrderWithItems:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
    OrderItemInput:
      type: object
      required: [productName, price, quantity]
      properties:
        productName:
          type: string
        imageUrl:
          type: string
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
          nullable: true
        quantity:
          type: integer
          minimum: 1
    OrderInput:
      type: object
      required: [orderNumber, customerName, email, phone, cep, city, address, state, total, items]
      properties:
        orderNumber:
          type: string
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        cep:
          type: string
        city:
          type: string
        address:
          type: string
        state:
          type: string
        note:
          type: string
        total:
          type: number
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
          minItems: 1
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
          nullable: true
        imageUrl:
          type: string
          minLength: 1
        description:
          type: string
        featured:
          type: boolean

